# =============================================================================
# File        : cluster/kind-cluster.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 1.3 (reused from Practical 1)
# Purpose     : Local 3-node kind cluster that runs Argo CD, the Sealed Secrets
#               controller and two copies of the Task Tracker (dev, staging).
#               Copied from Practical 1; only the cluster name changed
#               (dso202 -> dso202-gitops) so it cannot be confused with older
#               clusters.
# Create with : kind create cluster --name dso202-gitops --config cluster/kind-cluster.yaml
# Delete with : kind delete cluster --name dso202-gitops
# =============================================================================

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Cluster name -> container names dso202-gitops-control-plane, ...-worker,
# ...-worker2 and kubectl context kind-dso202-gitops.
name: dso202-gitops

networking:
  # API server on loopback only, never on a public interface.
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

nodes:
  # Control-plane node. Pinned node image (same as Practical 1, kind v0.32.0).
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane
    # Host port 30080 -> NodePort 30080 = dev frontend (http://localhost:30080).
    # Staging uses NodePort 30081, which is deliberately NOT mapped; it is
    # reached with kubectl port-forward instead.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=1"

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=2"
