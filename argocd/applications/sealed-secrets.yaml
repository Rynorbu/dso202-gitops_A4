# =============================================================================
# File        : argocd/applications/sealed-secrets.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 4.2.2, 4.3.1 (Listing 9)
# Purpose     : Installs the Sealed Secrets controller THROUGH GIT (no helm
#               install by hand). Helm chart 2.20.0 = controller 0.40.0.
#               Sync wave -2: the controller must exist before the platform
#               apps (wave -1) deliver SealedSecrets that it has to decrypt.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0   # the CHART version (installs controller 0.40.0)
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for a controller named "sealed-secrets-controller" by
        # default, so with this name kubeseal needs no --controller-name flag.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
