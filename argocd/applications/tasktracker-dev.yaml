# =============================================================================
# File        : argocd/applications/tasktracker-dev.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 4.3.1, 4.3.2, 4.3.3, 3.2 (Listing 14, converted in Task 10)
# Purpose     : Task Tracker in DEV, now with TWO sources (bonus Task 10):
#               1. the chart (path charts/tasktracker)
#               2. the values, referenced as $values (no path, ref: values)
#               $values resolves to the ROOT of the second source, so the
#               values path is relative to the repo root, not to the chart.
#               "sources" replaces "source"; the two cannot coexist.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-dev
  namespace: argocd
  labels:
    dso202/environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dso202
  sources:
    # Source 1: the chart
    - repoURL: https://github.com/Rynorbu/dso202-gitops_A4.git
      targetRevision: main
      path: charts/tasktracker
      helm:
        releaseName: tasktracker
        valueFiles:
          - $values/environments/dev/values.yaml
    # Source 2: the configuration, referenced above as $values
    - repoURL: https://github.com/Rynorbu/dso202-gitops_A4.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
