# =============================================================================
# File        : argocd/applications/tasktracker-staging.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 4.3.1, 4.3.2 (Listing 15)
# Purpose     : Task Tracker in STAGING - the release gate.
#               - follows a Git TAG, which never moves (promotion = a PR that
#                 changes targetRevision to the next tag)
#               - NO automated block: Argo CD reports OutOfSync and drift, but
#                 nothing is applied until a person runs a sync
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-staging
  namespace: argocd
  labels:
    dso202/environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dso202
  source:
    repoURL: https://github.com/Rynorbu/dso202-gitops_A4.git
    targetRevision: v1.0.0   # promoted release tag
    path: charts/tasktracker
    helm:
      releaseName: tasktracker
      valueFiles:
        - ../../environments/staging/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dso202-staging
  syncPolicy:
    # Deliberately no "automated:" block - manual sync only.
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
