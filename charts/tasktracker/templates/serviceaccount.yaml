# =============================================================================
# File        : charts/tasktracker/templates/serviceaccount.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 2.3, 4.4.1
# Purpose     : One ServiceAccount for the three tiers. None of the Pods talks
#               to the Kubernetes API, so the token is not mounted (least
#               privilege). ServiceAccount is in the dso202 AppProject whitelist.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.fullname" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
automountServiceAccountToken: false
