# =============================================================================
# File        : charts/tasktracker/templates/frontend-nginx-configmap.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 3.2 (ConfigMap mounted as a file)
# Purpose     : nginx configuration for the frontend container. It is the
#               image's own nginx.conf (Assignment 1, frontend/nginx.conf) plus
#               one 'location /api/' block that forwards API calls to the
#               backend Service inside the cluster.
# Why         : The browser cannot resolve the in-cluster name
#               tasktracker-backend, and localhost:8080 is taken by the Argo CD
#               port-forward. With this proxy the browser only talks to the
#               frontend's own address (localhost:30080 in dev, localhost:8082
#               in staging) and nginx forwards /api/ to the backend.
# =============================================================================
{{- if .Values.frontend.apiProxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tasktracker.fullname" . }}-frontend-nginx
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      # The image runs as the unprivileged 'nginx' user, so every temporary
      # path is under /tmp (unchanged from the image's own file).
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      sendfile on;
      keepalive_timeout 65;

      server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /config.js {
          add_header Cache-Control "no-store";
        }

        # Added: /api/tasks and /api/status go to the backend Service. The
        # Service is created with the other resources before the frontend
        # Deployment (wave 2) starts, so nginx resolves the name at start-up.
        location /api/ {
          proxy_pass http://{{ include "tasktracker.backendHost" . }}:{{ .Values.backend.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
{{- end }}
