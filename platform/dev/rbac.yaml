# =============================================================================
# File        : platform/dev/rbac.yaml
# Assignment  : DSO202 Assignment 4 - GitOps delivery with Argo CD
# Descriptor  : 2.3, 4.3.2 (Kubernetes RBAC, as in Assignment 2)
# Purpose     : Kubernetes RBAC for dso202-dev: a read-only Role for
#               developers, bound to the group "dso202-developers".
#               This is KUBERNETES RBAC (what an identity may do against the
#               API server). It is separate from ARGO CD RBAC in
#               bootstrap/argocd/argocd-rbac-cm-patch.yaml (see README Q4).
#               Delivered by platform-dev; the chart may not render Roles (C8).
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasktracker-viewer
  namespace: dso202-dev
  labels:
    dso202/assignment: "04"
    dso202/environment: dev
rules:
  # Read workloads and their status - no create, update or delete.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Secrets are deliberately NOT readable.

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasktracker-viewer-developers
  namespace: dso202-dev
  labels:
    dso202/assignment: "04"
    dso202/environment: dev
subjects:
  - kind: Group
    name: dso202-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: tasktracker-viewer
  apiGroup: rbac.authorization.k8s.io
